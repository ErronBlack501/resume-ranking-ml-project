[project]
name = "ai-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luca Heritiana TOBE", email = "123lucatobe@gmail.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "dvc>=3.67.1",
    "dvc-gdrive>=3.0.1",
    "fsspec>=2026.6.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=3.0",
]

[project.scripts]
ai-model = "ai_model:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
]

[tool.uv]
package = false
